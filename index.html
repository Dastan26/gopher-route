<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Гофер-маршрут</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a transit-map route of 10 stations (left rail) + the active station's panel (right). */
:root {
  --bg: #e9f0f3;
  --surface: #ffffff;
  --surface-2: #f3f7f9;
  --ink: #102730;
  --muted: #557079;
  --rule: #cfdde3;
  --accent: #00799a;
  --accent-ink: #ffffff;
  --accent-soft: #d5edf3;
  --gold: #c98a00;
  --ok: #1d7f52;
  --ok-soft: #dcf1e6;
  --bad: #b8402f;
  --bad-soft: #f8e0dc;
  --track: #b9cbd2;
  --code-bg: #0f2730;
  --code-fg: #d9e9ee;
  --t-k: #5fd0ec;
  --t-s: #f1c46b;
  --t-c: #7d97a1;
  --t-n: #f39a80;
  --t-b: #9be3b4;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a171c; --surface: #11232a; --surface-2: #162d35; --ink: #e2eef2; --muted: #8fa9b2;
    --rule: #22404a; --accent: #3cc3e2; --accent-ink: #062028; --accent-soft: #123a45;
    --gold: #f2b733; --ok: #4cc38a; --ok-soft: #113a29; --bad: #f07a68; --bad-soft: #3d1c17;
    --track: #2c4b55; --code-bg: #071216; --code-fg: #d9e9ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a171c; --surface: #11232a; --surface-2: #162d35; --ink: #e2eef2; --muted: #8fa9b2;
  --rule: #22404a; --accent: #3cc3e2; --accent-ink: #062028; --accent-soft: #123a45;
  --gold: #f2b733; --ok: #4cc38a; --ok-soft: #113a29; --bad: #f07a68; --bad-soft: #3d1c17;
  --track: #2c4b55; --code-bg: #071216; --code-fg: #d9e9ee; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 28px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .lab { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .val { font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.xpbar { width: 170px; max-width: 100%; height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.sync { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--track); }
.sync[data-s="ok"]::before { background: var(--ok); }
.sync[data-s="err"]::before { background: var(--bad); }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(250px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Route map */
.route { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 14px 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .route { position: static; } }
.route h2 { font-family: var(--f-display); font-size: .78rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 6px; }
.route ol { list-style: none; margin: 0; padding: 0; }
.st { position: relative; }
.st::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 6px; background: var(--track); }
.st:first-child::before { top: 24px; }
.st:last-child::before { bottom: calc(100% - 24px); }
.st.done::before { background: var(--accent); }
.st.done + .st::before { background: linear-gradient(var(--accent) 24px, var(--track) 24px); }
.st.done + .st.done::before { background: var(--accent); }
.st-btn { position: relative; width: 100%; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center; gap: 4px; padding: 6px 6px 6px 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 10px; }
.st-btn:hover:not(:disabled) { background: var(--surface-2); }
.st-btn:disabled { cursor: not-allowed; }
.st-btn[aria-current="true"] { background: var(--accent-soft); }
.dot { justify-self: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 5px solid var(--track); z-index: 1; }
.st.open .dot { border-color: var(--accent); }
.st.done .dot { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.st.boss .dot { border-radius: 5px; width: 26px; height: 26px; }
.st-txt { min-width: 0; display: flex; flex-direction: column; }
.st-no { font-family: var(--f-display); font-size: .68rem; color: var(--muted); letter-spacing: .06em; }
.st-name { font-weight: 600; font-size: .95rem; line-height: 1.25; }
.st.locked .st-name { color: var(--muted); font-weight: 500; }
.stars { font-size: .85rem; letter-spacing: 1px; color: var(--track); white-space: nowrap; }
.stars b { color: var(--gold); font-weight: 400; }
.lock { font-size: .75rem; color: var(--muted); }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(18px, 3vw, 32px); min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.panel h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.35rem, 3vw, 1.9rem); line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
.panel h3 { font-family: var(--f-display); font-weight: 500; font-size: 1.02rem; margin: 0; }
.lead { color: var(--muted); max-width: 64ch; margin: 0; }
.cards { display: flex; flex-direction: column; gap: 18px; }
.card { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--rule); min-width: 0; }
.card p { margin: 0; max-width: 68ch; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-family: var(--f-mono); font-size: .84rem; line-height: 1.6; tab-size: 4; }
pre.code code { background: none; padding: 0; font-size: inherit; color: inherit; }
.t-k { color: var(--t-k); } .t-s { color: var(--t-s); } .t-c { color: var(--t-c); font-style: italic; } .t-n { color: var(--t-n); } .t-b { color: var(--t-b); }

.mission { background: var(--surface-2); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.mission .lab { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mission p { margin: 0; }
.mission .done-when { color: var(--muted); font-size: .92rem; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 500; padding-inline: 8px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }

/* Quiz */
.qhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.pips { display: flex; gap: 5px; flex-wrap: wrap; }
.pip { width: 22px; height: 6px; border-radius: 99px; background: var(--track); }
.pip.ok { background: var(--ok); } .pip.bad { background: var(--bad); } .pip.cur { background: var(--accent); }
.streak { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.streak b { color: var(--gold); }
.qtext { font-size: 1.12rem; font-weight: 500; margin: 0; max-width: 64ch; }
.qtype { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 11px 14px; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; align-items: start; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); padding-top: .15em; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.opt .mono { font-family: var(--f-mono); font-size: .86rem; word-break: break-word; }

.order-box { display: flex; flex-direction: column; gap: 8px; }
.slot { min-height: 52px; border: 1.5px dashed var(--track); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.slot.empty::after { content: "Нажимай на строки ниже по порядку"; color: var(--muted); font-size: .9rem; padding: 6px; }
.chip { text-align: left; border: 1px solid var(--rule); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; cursor: pointer; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 6px; align-items: start; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip .n { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.chip .mono { font-family: var(--f-mono); font-size: .82rem; white-space: pre-wrap; word-break: break-word; }
.pool { display: flex; flex-direction: column; gap: 6px; }
.order-box .hint { font-size: .8rem; color: var(--muted); }

.fill { font-family: var(--f-mono); font-size: 1rem; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); width: 100%; max-width: 420px; }
.fill:focus { border-color: var(--accent); outline: none; }

.fb { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb strong { font-family: var(--f-display); font-weight: 500; }
.fb.ok strong { color: var(--ok); } .fb.bad strong { color: var(--bad); }
.fb p { margin: 0; max-width: 68ch; }

/* Result */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.score .big { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: .4em; color: var(--muted); font-weight: 500; }
.bigstars { font-size: 2rem; letter-spacing: 4px; color: var(--track); }
.bigstars b { color: var(--gold); font-weight: 400; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }

.rules { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.rules li { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.rules b { font-family: var(--f-display); font-weight: 500; font-size: .95rem; }
.rules span { color: var(--muted); font-size: .92rem; }
.ranks { display: flex; flex-wrap: wrap; gap: 8px; }
.rank { border: 1px solid var(--rule); border-radius: 99px; padding: 5px 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rank.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); font-weight: 600; }

.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--muted); font-size: .85rem; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Гофер<span>-</span>маршрут</h1>
      <p>Десять станций от первого <code>:=</code> до пода в Kubernetes. Бэкенд на Go для фронтендера.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main class="layout">
    <nav class="route" id="route" aria-label="Уровни"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
"use strict";

/* ---------- content ---------- */
const LEVELS = [
{
  id: "l1", week: "Неделя 1", title: "Основы языка",
  intro: "Типы, структуры, слайсы, map и ошибки. Всё, чем Go отличается от TypeScript на первом же файле.",
  theory: [
    { h: "Переменные и нулевые значения", p: "В Go нет <code>undefined</code>. Любая переменная сразу получает нулевое значение своего типа: <code>0</code> для чисел, <code>\"\"</code> для строк, <code>false</code> для bool и <code>nil</code> для указателей, слайсов, map, каналов и интерфейсов. Внутри функций обычно пишут короткое объявление <code>:=</code>.",
      code: `var count int        // 0
var title string     // ""
name := "Adidas"     // тип string выведен сам
brands := []string{} // пустой, но не nil` },
    { h: "Структуры и методы", p: "Классов нет, есть структуры и методы на них. Метод с получателем-указателем <code>*Brand</code> может менять структуру, получатель-значение работает с копией. Аргументы всегда передаются по значению, как если бы в JS объект клонировался на каждом вызове.",
      code: `type Brand struct {
    ID   int
    Name string
}

func (b *Brand) Rename(name string) {
    b.Name = name
}` },
    { h: "Слайсы и map", p: "Слайс — это окно на массив: указатель, длина и вместимость. Несколько слайсов могут смотреть на один массив, поэтому запись через один видна через другой. <code>append</code> возвращает новый слайс, результат нужно присвоить. В nil-map писать нельзя, сначала <code>make</code>.",
      code: `ids := []int{1, 2}
ids = append(ids, 3)

byName := make(map[string]int)
byName["Nike"] = 42
id, ok := byName["Puma"] // 0, false` },
    { h: "Ошибки — это значения", p: "Исключений нет. Функция, которая может не сработать, последним значением возвращает <code>error</code>, и вызывающий код проверяет его сразу. Ошибку оборачивают контекстом через <code>%w</code>, чтобы по цепочке было видно, где всё сломалось.",
      code: `func LoadBrand(id int) (Brand, error) {
    b, err := repo.Get(id)
    if err != nil {
        return Brand{}, fmt.Errorf("load brand %d: %w", id, err)
    }
    return b, nil
}` },
    { h: "Интерфейсы реализуются неявно", p: "Тип удовлетворяет интерфейсу, если у него есть нужные методы. Писать <code>implements</code> не нужно. Это похоже на структурную типизацию в TypeScript.",
      code: `type Validator interface {
    Validate() error
}

// Brand реализует Validator просто потому,
// что у него есть такой метод.
func (b Brand) Validate() error { return nil }` }
  ],
  qs: [
    { t: "choice", q: "Что выведет программа?", code: `var s []int
fmt.Println(s == nil, len(s))`, oc: true,
      opts: ["true 0", "false 0", "panic: nil slice", "[] 0"],
      why: "Нулевое значение слайса — <code>nil</code>, и длина у него 0. С nil-слайсом можно работать: <code>len</code>, <code>range</code> и <code>append</code> работают без ошибок." },
    { t: "choice", q: "Что произойдёт?", code: `var stock map[string]int
stock["Nike"] = 10`,
      opts: ["<code>panic: assignment to entry in nil map</code>", "В map появится ключ Nike со значением 10", "Ошибка компиляции", "Ничего, запись молча проигнорируется"],
      why: "Читать из nil-map можно, вернётся нулевое значение. Писать нельзя. Создайте map через <code>make(map[string]int)</code> или литерал <code>map[string]int{}</code>." },
    { t: "choice", q: "Что выведет программа?", code: `func rename(b Brand) {
    b.Name = "Nike"
}

b := Brand{Name: "Adidas"}
rename(b)
fmt.Println(b.Name)`,
      opts: ["Adidas", "Nike", "Пустую строку", "Ошибка компиляции"],
      why: "Структура передаётся по значению, и функция поменяла свою копию. Чтобы изменить оригинал, принимайте <code>*Brand</code> и вызывайте <code>rename(&amp;b)</code>." },
    { t: "choice", q: "Что выведет программа?", code: `s := []int{1, 2, 3}
t := s[:2]
t[0] = 9
fmt.Println(s)`, oc: true,
      opts: ["[9 2 3]", "[1 2 3]", "[9 2]", "panic: index out of range"],
      why: "<code>t</code> смотрит на тот же массив, что и <code>s</code>, поэтому запись через <code>t</code> видна через <code>s</code>. Для независимой копии используйте <code>slices.Clone</code> или <code>copy</code>." },
    { t: "fill", q: "Каким оператором внутри функции объявляют переменную и сразу присваивают ей значение? Введите оператор.",
      acc: [":="], why: "<code>x := 5</code> — короткое объявление. На уровне пакета оно не работает, там нужен <code>var</code>." },
    { t: "choice", q: "Как тип в Go начинает реализовывать интерфейс?",
      opts: ["Достаточно, чтобы у типа были все методы интерфейса", "Нужно написать <code>implements</code> после имени типа", "Нужно встроить интерфейс в структуру", "Нужно зарегистрировать тип в <code>init()</code>"],
      why: "Реализация неявная. Поэтому маленькие интерфейсы объявляют прямо там, где они нужны, не трогая исходный тип." },

{
  id: "l3", week: "Неделя 3", title: "HTTP-сервер",
  intro: "Стандартный net/http, роутинг, middleware и корректная остановка. Сторонний фреймворк не понадобится.",
  theory: [
    { h: "Handler — это интерфейс", p: "Весь <code>net/http</code> держится на одном интерфейсе с методом <code>ServeHTTP</code>. Обычную функцию превращает в Handler адаптер <code>http.HandlerFunc</code>.",
      code: `type Handler interface {
    ServeHTTP(w http.ResponseWriter, r *http.Request)
}` },
    { h: "Роутинг из коробки", p: "С Go 1.22 стандартный <code>ServeMux</code> понимает HTTP-метод и параметры пути. Для CRUD сторонний роутер больше не нужен.",
      code: `mux := http.NewServeMux()
mux.HandleFunc("GET /brands", h.list)
mux.HandleFunc("GET /brands/{id}", h.get)
mux.HandleFunc("PATCH /brands/{id}", h.update)

func (h *Handler) get(w http.ResponseWriter, r *http.Request) {
    id := r.PathValue("id")
    // ...
}` },
    { h: "Middleware", p: "Middleware — функция, которая принимает Handler и возвращает Handler. Это серверный аналог axios-интерсептора: код до <code>next.ServeHTTP</code> работает с запросом, после — с ответом.",
      code: `func Recover(next http.Handler) http.Handler {
    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
        defer func() {
            if err := recover(); err != nil {
                http.Error(w, "internal error", 500)
            }
        }()
        next.ServeHTTP(w, r)
    })
}` },
    { h: "Корректная остановка", p: "Если просто убить процесс, запросы, которые сейчас выполняются, оборвутся. <code>srv.Shutdown</code> перестаёт принимать новые соединения и ждёт текущие.",
      code: `ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)
defer stop()

go srv.ListenAndServe()
<-ctx.Done()

shutdownCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
defer cancel()
srv.Shutdown(shutdownCtx)` }
  ],
  qs: [
    { t: "choice", q: "Как в Go 1.22+ достать <code>{id}</code> из шаблона <code>GET /brands/{id}</code>?", oc: true,
      opts: ["r.PathValue(\"id\")", "r.URL.Query().Get(\"id\")", "mux.Vars(r)[\"id\"]", "r.Params[\"id\"]"],
      why: "<code>mux.Vars</code> — API стороннего gorilla/mux. <code>URL.Query</code> читает query-строку <code>?id=…</code>, а не путь." },
    { t: "choice", q: "Какой метод должен быть у типа, чтобы он был <code>http.Handler</code>?", oc: true,
      opts: ["ServeHTTP(http.ResponseWriter, *http.Request)", "Handle(*http.Request) http.Response", "ServeHTTP(*http.Request) error", "Call(w, r)"],
      why: "Ответ пишется в <code>ResponseWriter</code>, ничего не возвращается. Ошибки обрабатывают внутри и превращают в статус ответа." },
    { t: "choice", q: "Какой статус получит клиент?", code: `func create(w http.ResponseWriter, r *http.Request) {

}`,

    { t: "order", q: "Собери middleware, который логирует длительность запроса.", code: true,

      why: "Время засекаем до <code>next.ServeHTTP</code>, а логируем после: к этому моменту обработчик уже ответил." },
    { t: "choice", q: "Какой статус вернуть на успешный <code>POST /brands</code>, который создал бренд?",

    { t: "choice", q: "Фронт на <code>localhost:5173</code> ходит в API на <code>localhost:8080</code> и ловит ошибку CORS. Какой заголовок должен вернуть сервер?", oc: true,

      code: `var in UpdateBrandRequest

const NEED = 6;            // из 8 на обычном уровне
const BOSS_N = 12, BOSS_NEED = 10;
const XP_Q = 10, XP_PRACTICE = 30;
const RANKS = [
  { at: 0, name: "Стажёр" }, { at: 150, name: "Джун" }, { at: 400, name: "Мидл" },
  { at: 750, name: "Сеньор" }, { at: 1100, name: "Гофер-архитектор" }
];
const KEY = "gopher-route-v1";

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const norm = (s) => String(s).trim().toLowerCase().replace(/\s+/g, " ");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffleNot(a) { if (a.length < 2) return a.slice(); let s; do { s = shuffle(a); } while (s.every((v, i) => v === a[i])); return s; }

const KW = new Set("break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var FROM AS WORKDIR COPY RUN USER ENTRYPOINT SELECT INSERT INTO VALUES UPDATE SET WHERE ON CONFLICT DO CREATE INDEX DROP ORDER BY LIMIT OFFSET".split(" "));
const BI = new Set("append cap close copy delete len make new panic recover nil true false iota error string int bool byte rune any".split(" "));
function hl(src) {
  const re = /(\/\/[^\n]*|--[^\n]*|#[^\n]*)|("(?:[^"\\\n]|\\.)*"|`[^`]*`|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(src))) {
    if (m[1]) out += '<span class="t-c">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="t-s">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="t-n">' + m[3] + "</span>";
    else if (m[4]) out += KW.has(m[4]) ? '<span class="t-k">' + m[4] + "</span>" : BI.has(m[4]) ? '<span class="t-b">' + m[4] + "</span>" : m[4];
    else out += esc(m[5]);
  }
  return out;
}
const codeBlock = (src) => '<pre class="code"><code>' + hl(src) + "</code></pre>";

/* ---------- state ---------- */
const emptyState = () => ({ levels: {}, boss: { best: 0, passed: false } });
let state = emptyState();
let view = { screen: "home" };
let sync = "local";
let docRef = null;

function lv(id) { return state.levels[id] || { best: 0, passed: false, practice: false }; }
function starsFor(score, total, need) { return score >= need ? 3 - Math.min(2, total - score) : 0; }
function levelStars(id) { const l = lv(id); return starsFor(l.best, 8, NEED); }
function bossStars() { return starsFor(state.boss.best, BOSS_N, BOSS_NEED); }
function unlocked(i) { return i === 0 || lv(LEVELS[i - 1].id).passed; }
function allPassed() { return LEVELS.every((L) => lv(L.id).passed); }
function totalXP() {
  let x = 0;
  for (const L of LEVELS) { const l = lv(L.id); x += l.best * XP_Q + (l.practice ? XP_PRACTICE : 0); }
  return x + state.boss.best * XP_Q;
}
function rankOf(xp) { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i].at) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { r, next }; }
function nextLevelIndex() { const i = LEVELS.findIndex((L, i) => unlocked(i) && !lv(L.id).passed); return i; }

function clean(s) {
  const out = emptyState();
  if (!s || typeof s !== "object") return out;
  for (const L of LEVELS) {
    const v = s.levels && s.levels[L.id];
    if (v && typeof v === "object") out.levels[L.id] = { best: Math.max(0, Math.min(8, Number(v.best) || 0)), passed: !!v.passed, practice: !!v.practice };
  }
  if (s.boss) out.boss = { best: Math.max(0, Math.min(BOSS_N, Number(s.boss.best) || 0)), passed: !!s.boss.passed };
  return out;
}
function merge(a, b) {
  a = clean(a); b = clean(b);
  const out = emptyState();
  for (const L of LEVELS) {
    const x = a.levels[L.id], y = b.levels[L.id];
    if (!x && !y) continue;
    const p = x || { best: 0, passed: false, practice: false }, q = y || { best: 0, passed: false, practice: false };
    out.levels[L.id] = { best: Math.max(p.best, q.best), passed: p.passed || q.passed, practice: p.practice || q.practice };
  }
  out.boss = { best: Math.max(a.boss.best, b.boss.best), passed: a.boss.passed || b.boss.passed };
  return out;
}
const hasProgress = (s) => Object.keys(s.levels).length > 0 || s.boss.best > 0;

function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function loadLocal() { try { const raw = localStorage.getItem(KEY); if (raw) return clean(JSON.parse(raw)); } catch (e) {} return null; }

let writing = false, dirty = false;
async function pushRemote() {
  if (!docRef) return;
  if (writing) { dirty = true; return; }
  writing = true;
  try { await docRef.set(JSON.parse(JSON.stringify(state))); setSync("ok"); }
  catch (e) { setSync("err"); }
  writing = false;
  if (dirty) { dirty = false; pushRemote(); }
}
function persist() { saveLocal(); pushRemote(); }
function setSync(s) { sync = s; renderStats(); }

async function connect() {
  if (!window.claude || !window.claude.use) { setSync("local"); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { setSync("local"); return; }
    const id = await user.id();
    if (!id) { setSync("local"); return; }
    docRef = db.doc("data/users/" + id + "/progress");
    const snap = await docRef.get();
    if (snap.exists) {
      const remote = clean(snap.data());
      const merged = merge(state, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(remote);
      state = merged; saveLocal(); render();
      if (changed) pushRemote(); else setSync("ok");
    } else if (hasProgress(state)) { pushRemote(); }
    else setSync("ok");
  } catch (e) { setSync("err"); }
}

/* ---------- quiz engine ---------- */
function qAt(ref) { return LEVELS[ref[0]].qs[ref[1]]; }
function curQ() { return qAt(view.refs[view.i]); }
function startQuiz(id) {
  let refs;
  if (id === "boss") {
    const all = []; LEVELS.forEach((L, li) => L.qs.forEach((_, qi) => all.push([li, qi])));
    refs = shuffle(all).slice(0, BOSS_N);
  } else {
    const li = LEVELS.findIndex((L) => L.id === id);
    refs = LEVELS[li].qs.map((_, qi) => [li, qi]);
  }
  view = { screen: "quiz", id, refs, i: 0, correct: 0, streak: 0, results: [] };
  prepQ();
}
function prepQ() {
  const q = curQ();
  view.picked = null; view.checked = false; view.ok = null; view.fill = ""; view.ans = [];
  view.perm = q.t === "choice" ? shuffle(q.opts.map((_, i) => i)) : null;
  view.pool = q.t === "order" ? shuffleNot(q.lines.map((_, i) => i)) : null;
}
function canCheck() {
  const q = curQ();
  if (q.t === "choice") return view.picked !== null;
  if (q.t === "order") return view.ans.length === q.lines.length;
  return norm(view.fill).length > 0;
}
function check() {
  if (view.checked || !canCheck()) return;
  const q = curQ();
  let ok;
  if (q.t === "choice") ok = view.picked === 0;
  else if (q.t === "order") ok = view.ans.every((v, i) => v === i);
  else ok = q.acc.map(norm).includes(norm(view.fill));
  view.checked = true; view.ok = ok; view.results.push(ok);
  if (ok) { view.correct++; view.streak++; } else view.streak = 0;
}
function next() {
  if (view.i < view.refs.length - 1) { view.i++; prepQ(); return; }
  finish();
}
function finish() {
  const score = view.correct;
  let prevBest, passed, total, need;
  if (view.id === "boss") {
    total = BOSS_N; need = BOSS_NEED; prevBest = state.boss.best;
    state.boss = { best: Math.max(prevBest, score), passed: state.boss.passed || score >= need };
  } else {
    total = 8; need = NEED; const l = lv(view.id); prevBest = l.best;
    state.levels[view.id] = { best: Math.max(prevBest, score), passed: l.passed || score >= need, practice: l.practice };
  }
  passed = score >= need;
  view = { screen: "result", id: view.id, score, total, need, passed, gained: Math.max(0, score - prevBest) * XP_Q, results: view.results };
  persist();
}

/* ---------- render ---------- */
function starStr(n) { return "<b>" + "★".repeat(n) + "</b>" + "★".repeat(3 - n); }

function renderStats() {
  const xp = totalXP(), { r, next } = rankOf(xp);
  const pct = next ? Math.round(((xp - r.at) / (next.at - r.at)) * 100) : 100;
  const passed = LEVELS.filter((L) => lv(L.id).passed).length;
  const syncText = { ok: "Прогресс сохранён в аккаунте", local: "Прогресс хранится в этом браузере", err: "Не удалось сохранить в аккаунт, повторим после следующего ответа" }[sync];
  $("#stats").innerHTML =
    '<div class="stat"><span class="lab">Ранг</span><span class="val">' + r.name + "</span></div>" +
    '<div class="stat"><span class="lab">Опыт</span><span class="val">' + xp + " XP" + (next ? ' <span style="color:var(--muted);font-size:.8em">/ ' + next.at + "</span>" : "") + '</span><div class="xpbar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="До следующего ранга"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="stat"><span class="lab">Станции</span><span class="val">' + passed + " / " + LEVELS.length + "</span></div>" +
    '<div class="sync" data-s="' + sync + '">' + syncText + "</div>";
}

function renderRoute() {
  const cur = view.id;
  let h = "<h2>Маршрут</h2><ol>";
  LEVELS.forEach((L, i) => {
    const l = lv(L.id), open = unlocked(i);
    const cls = ["st", l.passed ? "done" : "", open ? "open" : "locked"].join(" ");
    h += '<li class="' + cls + '"><button class="st-btn" data-act="open" data-id="' + L.id + '"' + (open ? "" : " disabled") + (cur === L.id ? ' aria-current="true"' : "") + ">" +
      '<span class="dot" aria-hidden="true"></span><span class="st-txt"><span class="st-no">' + String(i + 1).padStart(2, "0") + " · " + L.week + '</span><span class="st-name">' + L.title + "</span></span>" +
      (open ? '<span class="stars" aria-label="Звёзд: ' + levelStars(L.id) + ' из 3">' + starStr(levelStars(L.id)) + "</span>" : '<span class="lock">закрыто</span>') +
      "</button></li>";
  });
  const bOpen = allPassed();
  h += '<li class="st boss ' + (state.boss.passed ? "done" : "") + " " + (bOpen ? "open" : "locked") + '"><button class="st-btn" data-act="open" data-id="boss"' + (bOpen ? "" : " disabled") + (cur === "boss" ? ' aria-current="true"' : "") + ">" +
    '<span class="dot" aria-hidden="true"></span><span class="st-txt"><span class="st-no">Финал</span><span class="st-name">Экзамен по всему маршруту</span></span>' +
    (bOpen ? '<span class="stars">' + starStr(bossStars()) + "</span>" : '<span class="lock">после 10</span>') + "</button></li>";
  $("#route").innerHTML = h + "</ol>";
}

function renderHome() {
  const ni = nextLevelIndex(), xp = totalXP(), { r } = rankOf(xp);
  let cta;
  if (ni >= 0) cta = '<button class="btn primary" id="primary" data-act="open" data-id="' + LEVELS[ni].id + '">' + (hasProgress(state) ? "Продолжить: " : "Начать: ") + LEVELS[ni].title + "</button>";
  else if (!state.boss.passed) cta = '<button class="btn primary" id="primary" data-act="open" data-id="boss">Перейти к финальному экзамену</button>';
  else cta = '<button class="btn primary" id="primary" data-act="open" data-id="boss">Пересдать финал на 3 звезды</button>';
  return '<div><div class="eyebrow">Как играть</div><h2>Десять станций до своего сервиса на Go</h2></div>' +
    '<p class="lead">Каждая станция — неделя плана. Сначала короткая теория, потом 8 вопросов: выбрать ответ, предсказать вывод программы, собрать код по строкам или вписать команду. По ходу ты собираешь свой сервис <code>mdm-dict-go</code>: справочник брендов и сертификатов с тем же JSON:API, что у фронта MDM.</p>' +
    '<ul class="rules">' +
    "<li><b>6 из 8, чтобы проехать</b><span>Следующая станция открывается, когда ответишь правильно хотя бы на 6 вопросов. 7 — две звезды, 8 — три.</span></li>" +
    "<li><b>Опыт за лучший результат</b><span>10 XP за каждый верный ответ в лучшей попытке. Переигрывать можно сколько угодно, опыт растёт только при улучшении.</span></li>" +
    "<li><b>Практика даёт больше</b><span>У каждой станции есть задание для сервиса. Отметь, что сделал его, и получи ещё 30 XP.</span></li>" +
    "<li><b>Финальный экзамен</b><span>12 случайных вопросов со всего маршрута, нужно 10. Открывается после десятой станции.</span></li>" +
    "</ul>" +
    '<div class="row">' + cta + "</div>" +
    '<div class="card"><h3>Ранги</h3><div class="ranks">' + RANKS.map((x) => '<span class="rank' + (x === r ? " on" : "") + '">' + x.name + " · " + x.at + " XP</span>").join("") + "</div></div>";
}

function renderTheory(L) {
  const l = lv(L.id);
  return '<div><div class="eyebrow">' + L.week + " · станция " + (LEVELS.indexOf(L) + 1) + "</div><h2>" + L.title + '</h2></div><p class="lead">' + L.intro + "</p>" +
    '<div class="cards">' + L.theory.map((t) => '<article class="card"><h3>' + t.h + "</h3>" + (t.p ? "<p>" + t.p + "</p>" : "") + (t.code ? codeBlock(t.code) : "") + "</article>").join("") + "</div>" +
    missionBox(L, l) +
    '<div class="row"><button class="btn primary" id="primary" data-act="start">' + (l.best ? "Пройти проверку ещё раз" : "Начать проверку: 8 вопросов") + "</button>" +
    (l.best ? '<span class="streak">Лучший результат: ' + l.best + " из 8</span>" : "") + "</div>";
}
function missionBox(L, l) {
  return '<div class="mission"><span class="lab">Задание для mdm-dict-go</span><p>' + L.mission.text + '</p><p class="done-when">Готово, когда: ' + L.mission.done + "</p>" +
    (l.passed ? '<label class="check"><input type="checkbox" id="practice-' + L.id + '" data-act="practice" data-id="' + L.id + '"' + (l.practice ? " checked" : "") + "><span>Сделал это задание на практике (+" + XP_PRACTICE + " XP)</span></label>" : '<p class="done-when">Отметить выполнение можно после того, как пройдёшь станцию.</p>') +
    "</div>";
}
function renderBossIntro() {
  return '<div><div class="eyebrow">Финал</div><h2>Экзамен по всему маршруту</h2></div>' +
    '<p class="lead">12 случайных вопросов со всех десяти станций. Чтобы сдать, нужно 10 верных. Каждая попытка собирает новый набор.</p>' +
    '<div class="row"><button class="btn primary" id="primary" data-act="start">Начать экзамен</button>' +
    (state.boss.best ? '<span class="streak">Лучший результат: ' + state.boss.best + " из " + BOSS_N + "</span>" : "") + "</div>";
}

function renderQuiz() {
  const q = curQ(), ref = view.refs[view.i], n = view.refs.length;
  const pips = view.refs.map((_, i) => '<span class="pip ' + (i < view.results.length ? (view.results[i] ? "ok" : "bad") : i === view.i ? "cur" : "") + '"></span>').join("");
  const typeLabel = { choice: q.code ? "Прочитай код" : "Выбери ответ", order: "Расставь по порядку", fill: "Впиши ответ" }[q.t];
  let h = '<div class="qhead"><div class="pips" aria-label="Вопрос ' + (view.i + 1) + " из " + n + '">' + pips + '</div><span class="streak">Вопрос ' + (view.i + 1) + " из " + n + (view.streak >= 2 ? " · серия <b>" + view.streak + "</b>" : "") + "</span></div>";
  h += '<div><div class="qtype">' + typeLabel + (view.id === "boss" ? " · " + LEVELS[ref[0]].title : "") + '</div><p class="qtext" id="qtext" tabindex="-1">' + q.q + "</p></div>";
  if (q.code && typeof q.code === "string") h += codeBlock(q.code);

  if (q.t === "choice") {
    h += '<div class="opts" role="group" aria-label="Варианты ответа">';
    view.perm.forEach((oi, k) => {
      let cls = "opt";
      if (view.checked) { if (oi === 0) cls += " right"; else if (oi === view.picked) cls += " wrong"; }
      else if (oi === view.picked) cls += " sel";
      const txt = q.oc ? '<span class="mono">' + esc(q.opts[oi]) + "</span>" : "<span>" + q.opts[oi] + "</span>";
      h += '<button class="' + cls + '" data-act="pick" data-i="' + oi + '"' + (view.checked ? " disabled" : "") + ' aria-pressed="' + (oi === view.picked) + '"><span class="k">' + "ABCD"[k] + "</span>" + txt + "</button>";
    });
    h += "</div>";
  } else if (q.t === "order") {
    const mono = q.code === true;
    const line = (li) => '<span class="' + (mono ? "mono" : "") + '">' + esc(q.lines[li]) + "</span>";
    h += '<div class="order-box"><span class="hint">Твой порядок</span><div class="slot' + (view.ans.length ? "" : " empty") + '">';
    view.ans.forEach((li, k) => {
      let style = "";
      if (view.checked) style = ' style="border-color:var(' + (li === k ? "--ok" : "--bad") + ')"';
      h += '<button class="chip" data-act="unchip" data-k="' + k + '"' + (view.checked ? " disabled" : "") + style + ' aria-label="Убрать строку"><span class="n">' + (k + 1) + "</span>" + line(li) + "</button>";
    });
    h += "</div>";
    const rest = view.pool.filter((li) => !view.ans.includes(li));
    if (rest.length) {
      h += '<span class="hint">Строки</span><div class="pool">' + rest.map((li) => '<button class="chip" data-act="chip" data-li="' + li + '"><span class="n">+</span>' + line(li) + "</button>").join("") + "</div>";
    }
    h += "</div>";
    if (view.checked && !view.ok) h += '<div class="order-box"><span class="hint">Правильный порядок</span><div class="slot">' + q.lines.map((_, li) => '<div class="chip" style="cursor:default"><span class="n">' + (li + 1) + "</span>" + line(li) + "</div>").join("") + "</div></div>";
  } else {
    h += '<div class="row"><input class="fill" id="fill-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ" value="' + esc(view.fill) + '"' + (view.checked ? " disabled" : "") + "></div>";
    if (view.checked && !view.ok) h += '<p class="done-when" style="margin:0">Правильный ответ: <code>' + esc(q.acc[0]) + "</code></p>";
  }

  if (view.checked) {
    h += '<div class="fb ' + (view.ok ? "ok" : "bad") + '"><strong>' + (view.ok ? "Верно" : "Неверно") + "</strong><p>" + q.why + "</p></div>";
    h += '<div class="row"><button class="btn primary" id="primary" data-act="next">' + (view.i < n - 1 ? "Следующий вопрос" : "Посмотреть результат") + "</button></div>";
  } else {
    h += '<div class="row"><button class="btn primary" id="check-btn" data-act="check"' + (canCheck() ? "" : " disabled") + ">Проверить</button>" +
      (q.t === "order" && view.ans.length ? '<button class="btn ghost" data-act="clear">Сбросить порядок</button>' : "") +
      '<button class="btn ghost" data-act="quit">Выйти к теории</button></div>';
  }
  return h;
}

function renderResult() {
  const isBoss = view.id === "boss";
  const L = isBoss ? null : LEVELS.find((x) => x.id === view.id);
  const stars = starsFor(view.score, view.total, view.need);
  const li = isBoss ? -1 : LEVELS.indexOf(L);
  let h = '<div><div class="eyebrow">' + (isBoss ? "Финал" : L.week + " · " + L.title) + "</div><h2>" +
    (view.passed ? (isBoss ? "Экзамен сдан. Маршрут пройден" : "Станция пройдена") : "Пока не хватило") + "</h2></div>";
  h += '<div class="score"><span class="big">' + view.score + "<small> / " + view.total + '</small></span><span class="bigstars" aria-label="Звёзд: ' + stars + '">' + starStr(stars) + "</span></div>";
  h += '<p class="lead">' + (view.passed
    ? (view.gained ? "Получено " + view.gained + " XP. " : "Лучший результат не превышен, опыт не изменился. ") + (stars < 3 ? "До трёх звёзд не хватает " + (view.total - view.score) + "." : "Без единой ошибки.")
    : "Нужно " + view.need + " из " + view.total + ". Перечитай теорию: разбор к каждому ответу был под вопросом." + (view.gained ? " Зато +" + view.gained + " XP за новый лучший результат." : "")) + "</p>";
  if (!isBoss) h += missionBox(L, lv(L.id));
  h += '<div class="row">';
  if (view.passed && !isBoss && li < LEVELS.length - 1) h += '<button class="btn primary" id="primary" data-act="open" data-id="' + LEVELS[li + 1].id + '">Следующая станция: ' + LEVELS[li + 1].title + "</button>";
  else if (view.passed && !isBoss && allPassed()) h += '<button class="btn primary" id="primary" data-act="open" data-id="boss">К финальному экзамену</button>';
  h += '<button class="btn' + (view.passed ? "" : " primary") + '"' + (view.passed ? "" : ' id="primary"') + ' data-act="start">Пройти ещё раз</button>';
  if (!isBoss) h += '<button class="btn ghost" data-act="open" data-id="' + L.id + '">К теории</button>';
  h += "</div>";
  return h;
}

function renderPanel() {
  let h;
  if (view.screen === "home") h = renderHome();
  else if (view.screen === "theory") h = view.id === "boss" ? renderBossIntro() : renderTheory(LEVELS.find((L) => L.id === view.id));
  else if (view.screen === "quiz") h = renderQuiz();
  else h = renderResult();
  $("#panel").innerHTML = h;
}
let confirmReset = false;
function renderFoot() {
  $("#foot").innerHTML = '<span>Вопросы проверены на Go 1.22+ и актуальных версиях pgx, go-oidc и franz-go.</span>' +
    (confirmReset
      ? '<span class="confirm">Стереть весь прогресс? <button class="btn danger" data-act="reset-yes">Стереть</button><button class="btn ghost" data-act="reset-no">Отмена</button></span>'
      : '<span class="row"><button class="btn ghost" data-act="home">Как играть</button>' + (hasProgress(state) ? '<button class="btn ghost" data-act="reset-ask">Сбросить прогресс</button>' : "") + "</span>");
}
function render() { renderStats(); renderRoute(); renderPanel(); renderFoot(); }

function focusAfter(sel, scroll) {
  const el = $(sel);
  if (el) el.focus({ preventScroll: !scroll });
  if (scroll && window.matchMedia("(max-width: 860px)").matches) $("#panel").scrollIntoView({ block: "start" });
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "practice") return;
  if (act === "open") {
    const id = b.dataset.id;
    view = { screen: "theory", id };
    render(); focusAfter(".panel h2", true);
    $(".panel h2") && $(".panel h2").setAttribute("tabindex", "-1");
    return;
  }
  if (act === "home") { view = { screen: "home" }; render(); focusAfter("#primary", true); return; }
  if (act === "start") { startQuiz(view.id); render(); focusAfter("#qtext", true); return; }
  if (act === "quit") { view = { screen: "theory", id: view.id }; render(); return; }
  if (act === "pick") { view.picked = Number(b.dataset.i); renderPanel(); focusAfter("#check-btn"); return; }
  if (act === "chip") { view.ans.push(Number(b.dataset.li)); renderPanel(); const nb = $('[data-act="chip"]') || $("#check-btn"); nb && nb.focus(); return; }
  if (act === "unchip") { view.ans.splice(Number(b.dataset.k), 1); renderPanel(); return; }
  if (act === "clear") { view.ans = []; renderPanel(); return; }
  if (act === "check") { check(); renderPanel(); renderRoute(); focusAfter("#primary"); return; }
  if (act === "next") {
    next();
    if (view.screen === "result") { render(); focusAfter("#primary", true); }
    else { renderPanel(); focusAfter("#qtext"); }
    return;
  }
  if (act === "reset-ask") { confirmReset = true; renderFoot(); return; }
  if (act === "reset-no") { confirmReset = false; renderFoot(); return; }
  if (act === "reset-yes") { confirmReset = false; state = emptyState(); view = { screen: "home" }; persist(); render(); return; }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "practice") {
    const id = t.dataset.id, l = lv(id);
    state.levels[id] = { ...l, practice: t.checked };
    persist(); renderStats();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "fill-input" && view.screen === "quiz") {
    view.fill = e.target.value;
    const cb = $("#check-btn"); if (cb) cb.disabled = !canCheck();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "fill-input" && view.screen === "quiz" && !view.checked) {
    e.preventDefault(); check(); renderPanel(); renderRoute(); focusAfter("#primary");
  }
});

/* ---------- boot ---------- */
function start(data) {
  const local = loadLocal();
  if (local) state = local;
  if (data && data.state) state = merge(state, data.state);
  if (data && data.view && data.view.screen) view = data.view;
  render();
  connect();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => ({ state, view })); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>

</body></html>
